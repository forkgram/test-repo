name: Probe release permission.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report what the token may do.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- repository ---"
          gh api repos/$GITHUB_REPOSITORY -q '"fork: \(.fork)  private: \(.private)  owner: \(.owner.type)"'

          echo "--- can the token read releases? ---"
          gh api repos/$GITHUB_REPOSITORY/releases -q 'length' && echo "read: OK" || echo "read: FAILED"

          echo "--- draft release (creates no tag) ---"
          set +e
          out=$(gh api -X POST repos/$GITHUB_REPOSITORY/releases \
            -f tag_name=probe-draft-delete-me \
            -f name=probe-draft \
            -F draft=true 2>&1)
          code=$?
          if [ $code -eq 0 ]; then
            echo "draft create: OK"
            id=$(printf '%s' "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id >/dev/null && echo "  cleaned up"
          else
            echo "draft create: FAILED"; printf '%s\n' "$out" | head -3
          fi

          echo "--- published release with a NEW tag (this is what the real job does) ---"
          out=$(gh api -X POST repos/$GITHUB_REPOSITORY/releases \
            -f tag_name=probe-tag-delete-me \
            -f name=probe-tag \
            -f target_commitish=$GITHUB_SHA \
            -F draft=false 2>&1)
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "published create: OK"
            id=$(printf '%s' "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id >/dev/null && echo "  cleaned up release"
            gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/probe-tag-delete-me >/dev/null 2>&1 && echo "  cleaned up tag"
          else
            echo "published create: FAILED"
            printf '%s\n' "$out" | head -5
          fi
