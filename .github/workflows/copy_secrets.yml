name: Copy secrets.

# One-off: moves this playground's secrets into the repository the XP port
# actually lives in. The values pass through the runner in memory only - nothing
# is printed, and GitHub masks a secret if something tries to.
#
# TDESKTOP_API_ID / TDESKTOP_API_HASH are deliberately NOT copied: the ones here
# are placeholders, and a build made with them compiles, passes every gate,
# starts on XP - and never logs in. Set the real ones by hand in the target.
#
# Needs a secret TARGET_REPO_PAT in THIS repository: a token that can write
# secrets in the target. A fine-grained token needs, on the target repository,
# Secrets: read and write, Environments: read and write, Metadata: read.
#
# Delete this workflow and revoke the token once the move is done.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'owner/repo to copy the secrets into.'
        type: string
        default: 'forkgram/tdesktop-xp'

permissions: {}

jobs:

  repository-secrets:
    name: Repository secrets.
    runs-on: ubuntu-latest
    steps:
      - name: Copy.
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          TARGET: ${{ inputs.target }}
          S_PACKER_PRIVATE_KEY: ${{ secrets.PACKER_PRIVATE_KEY }}
          S_PACKER_PRIVATE_BETA_KEY: ${{ secrets.PACKER_PRIVATE_BETA_KEY }}
          S_ALPHA_PRIVATE_KEY: ${{ secrets.ALPHA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TARGET_REPO_PAT is not set in this repository."
            exit 1
          fi
          for name in PACKER_PRIVATE_KEY PACKER_PRIVATE_BETA_KEY ALPHA_PRIVATE_KEY; do
            var="S_$name"
            value="${!var-}"
            if [ -z "$value" ]; then
              echo "skip    $name - empty here"
              continue
            fi
            # Through stdin, not --body: these are PEM keys, and printf keeps the
            # value byte-exact instead of appending a newline the signature check
            # would then have to survive.
            printf '%s' "$value" | gh secret set "$name" -R "$TARGET"
            echo "copied  $name (${#value} chars)"
          done

  environment-secrets:
    name: telegram-publish environment.
    runs-on: ubuntu-latest
    # The only way to read these here: they live in this environment, not in the
    # repository. The same environment is created in the target below.
    environment: telegram-publish
    steps:
      - name: Copy.
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          TARGET: ${{ inputs.target }}
          S_TG_SESSION: ${{ secrets.TG_SESSION }}
          S_TG_FEED_CHANNEL: ${{ secrets.TG_FEED_CHANNEL }}
          S_TG_FILES_CHANNEL: ${{ secrets.TG_FILES_CHANNEL }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TARGET_REPO_PAT is not set in this repository."
            exit 1
          fi
          # The environment name is what xp_release.yml's publish job declares,
          # so it has to exist in the target with exactly this name.
          gh api -X PUT "repos/$TARGET/environments/telegram-publish" >/dev/null
          echo "environment telegram-publish ready in $TARGET"
          for name in TG_SESSION TG_FEED_CHANNEL TG_FILES_CHANNEL; do
            var="S_$name"
            value="${!var-}"
            if [ -z "$value" ]; then
              echo "skip    $name - empty here"
              continue
            fi
            printf '%s' "$value" | gh secret set "$name" -R "$TARGET" --env telegram-publish
            echo "copied  $name (${#value} chars)"
          done

  what-is-left:
    name: What still has to be set by hand.
    runs-on: ubuntu-latest
    needs: [repository-secrets, environment-secrets]
    steps:
      - run: |
          echo "::notice::Set TDESKTOP_API_ID and TDESKTOP_API_HASH in ${{ inputs.target }} by hand - the ones here are placeholders and produce a build that cannot log in."
